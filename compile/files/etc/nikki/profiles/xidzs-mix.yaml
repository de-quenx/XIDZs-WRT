mode: rule
log-level: info
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
sniffing:
  enable: true
  sniff:
    tls:
      ports:
        - 443
        - 8443
    http:
      ports:
        - 80
        - 8080-8880
  force-dns-mapping: true
tun:
  enable: true
  stack: mixed
  device: nikki
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  strict-route: true
  mtu: 1420
  endpoint-independent-nat: true
find-process-mode: off
keep-alive-idle: 60
keep-alive-interval: 10
proxy-providers:
  MODEM1:
    type: file
    path: "./providers/proxy/modem1.yaml"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 10
  MODEM2:
    type: file
    path: "./providers/proxy/modem2.yaml"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 10
proxy-groups:
  - name: MODEM1
    type: select
    disable-udp: false
    interface-name: usb0
    use:
      - MODEM1
  - name: MODEM2
    type: select
    disable-udp: false
    interface-name: eth1
    use:
      - MODEM2
  - name: LB-2-MODEM
    type: load-balance
    strategy: round-robin
    disable-udp: false
    proxies:
      - MODEM1
      - MODEM2
    url: https://www.gstatic.com/generate_204
    interval: 60
  - name: SERVER-UMUM
    type: select
    disable-udp: false
    proxies:
      - LB-2-MODEM
      - MODEM1
      - MODEM2
      - DIRECT
  - name: SERVER-INDO
    type: select
    disable-udp: false
    proxies:
      - LB-2-MODEM
      - MODEM1
      - MODEM2
      - DIRECT
  - name: SERVER-GAME
    type: select
    disable-udp: false
    proxies:
      - LB-2-MODEM
      - MODEM1
      - MODEM2
      - DIRECT
  - name: BLOCK-IKLAN
    type: select
    disable-udp: false
    proxies:
      - REJECT
      - LB-2-MODEM
rule-providers:
  Game:
    type: file
    behavior: classical
    path: "./providers/rule/game.yaml"
  PortGame:
    type: file
    behavior: classical
    path: "./providers/rule/portgame.yaml"
  Umum:
    type: file
    behavior: classical
    path: "./providers/rule/umum.yaml"
  indo:
    type: file
    behavior: classical
    path: "./providers/rule/indo.yaml"
  Sosmed:
    type: file
    behavior: classical
    path: "./providers/rule/sosmed.yaml"
  Streaming:
    type: file
    behavior: classical
    path: "./providers/rule/streaming.yaml"
  Bankid:
    type: file
    behavior: domain
    path: "./providers/rule/bankid.yaml"
  Tiktok:
    type: file
    behavior: domain
    path: "./providers/rule/tiktok.yaml"
  Meta:
    type: file
    behavior: domain
    path: "./providers/rule/meta.yaml"
  Oisd_small:
    type: http
    behavior: classical
    path: "./providers/rule/oisd_small.yaml"
    url: https://raw.githubusercontent.com/hillz2/openclash_adblock/main/oisd_small.yaml
    interval: 28800
rules:
  - RULE-SET,Umum,SERVER-UMUM
  - RULE-SET,Game,SERVER-GAME
  - RULE-SET,PortGame,SERVER-GAME
  - RULE-SET,indo,SERVER-INDO
  - RULE-SET,Sosmed,SERVER-INDO
  - RULE-SET,Streaming,SERVER-UMUM
  - RULE-SET,Bankid,SERVER-INDO
  - RULE-SET,Tiktok,SERVER-UMUM
  - RULE-SET,Meta,SERVER-INDO
  - RULE-SET,Oisd_small,BLOCK-IKLAN
  - MATCH,SERVER-UMUM
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: 0.0.0.0:1053
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
  respect-rules: true
  use-system-hosts: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - tls://1.0.0.1
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  prefer-h3: false
