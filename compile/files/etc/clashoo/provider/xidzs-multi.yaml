proxy-providers:
  MIX:
    type: file
    path: "./proxyprovider/mix.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 120
proxy-groups:
  - name: AUTO-MIX
    type: fallback
    disable-udp: false
    use:
      - MIX
    url: http://www.gstatic.com/generate_204
    interval: 120
  - name: SERVER-UMUM
    type: select
    disable-udp: false
    proxies:
      - AUTO-MIX
      - DIRECT
  - name: SERVER-GAME
    type: select
    disable-udp: false
    proxies:
      - SERVER-UMUM
      - DIRECT
  - name: FB-IG-LINE
    type: select
    disable-udp: false
    proxies:
      - DIRECT
      - SERVER-UMUM
  - name: WHATSAPP
    type: select
    disable-udp: false
    proxies:
      - DIRECT
      - SERVER-UMUM
  - name: YOUTUBE
    type: select
    disable-udp: false
    proxies:
      - DIRECT
      - SERVER-UMUM
  - name: NETFLIX
    type: select
    disable-udp: false
    proxies:
      - DIRECT
      - SERVER-UMUM
  - name: TIKTOK
    type: select
    disable-udp: false
    proxies:
      - DIRECT
      - SERVER-UMUM
rule-providers:
  bankid:
    type: file
    behavior: domain
    path: "./ruleprovider/bankid.yaml"
  game:
    type: file
    behavior: classical
    path: "./ruleprovider/game.yaml"
  portgame:
    type: file
    behavior: classical
    path: "./ruleprovider/portgame.yaml"
  umum:
    type: file
    behavior: classical
    path: "./ruleprovider/umum.yaml"
  whatsapp:
    type: file
    behavior: classical
    path: "./ruleprovider/whatsapp.yaml"
  youtube:
    type: file
    behavior: classical
    path: "./ruleprovider/youtube.yaml"
  fb:
    type: file
    behavior: classical
    path: "./ruleprovider/fb.yaml"
  meta:
    type: file
    behavior: classical
    path: "./ruleprovider/meta.yaml"
  ig:
    type: file
    behavior: classical
    path: "./ruleprovider/ig.yaml"
  line:
    type: file
    behavior: classical
    path: "./ruleprovider/line.yaml"
  netflix:
    type: file
    behavior: classical
    path: "./ruleprovider/netflix.yaml"
  tiktok:
    type: file
    behavior: classical
    path: "./ruleprovider/tiktok.yaml"
rules:
  - RULE-SET,whatsapp,WHATSAPP
  - RULE-SET,line,FB-IG-LINE
  - RULE-SET,fb,FB-IG-LINE
  - RULE-SET,meta,FB-IG-LINE
  - RULE-SET,ig,FB-IG-LINE
  - RULE-SET,youtube,YOUTUBE
  - RULE-SET,netflix,NETFLIX
  - RULE-SET,tiktok,TIKTOK
  - RULE-SET,umum,SERVER-UMUM
  - RULE-SET,game,SERVER-GAME
  - RULE-SET,portgame,SERVER-GAME
  - RULE-SET,bankid,SERVER-UMUM
  - MATCH,SERVER-UMUM
dns:
  enable: true
  listen: '0.0.0.0:1053'
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - tls://1.0.0.1
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
    - tls://8.8.4.4
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    ipcidr:
      - 240.0.0.0/4
  prefer-h3: false
